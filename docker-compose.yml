# Mellox AI — single-server production stack (proposal workstream A).
#
#   app    Next.js standalone server (Dockerfile), never exposed directly
#   redis  shared cache for AI responses/images (cache only: no persistence)
#   caddy  TLS termination with automatic Let's Encrypt certificates
#
# Secrets come from ./.env on the server (mode 600, never committed); see
# docs/DEPLOYMENT.md. Deploy with deploy/deploy.sh, which tags each build and
# rolls back automatically when the new container fails its health check.
#
# The Social Distribution Engine runs as its own stack
# (Social-Distribtion-Engine-RavalAI-SDE/, ADR-0005).

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set in .env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set in .env}
    image: mellox-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set in .env}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3000"
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Cache only: bounded memory, LRU eviction, no disk snapshots.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
