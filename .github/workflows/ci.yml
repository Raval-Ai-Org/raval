name: CI

# The gate the repo was missing. Before this workflow the only automated check
# was seo-meta-tests.yml (Playwright SEO snapshots) — so `tsc`, `eslint` and the
# 183 vitest tests (including every SDR contract suite that proves webhook
# signature verification, idempotency and terminal-wins) never ran on a PR.
#
# Configure "verify" as a required status check in branch protection.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Format · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs first: a type error makes every later failure harder to read.
      - name: Typecheck
        run: npm run typecheck

      # Warnings are allowed (386 pre-existing `any`/unused findings). Errors
      # are not. Drop --max-warnings once that backlog is paid down.
      - name: Lint
        run: npx eslint . --max-warnings 400

      # Guards the LF normalization from .gitattributes. Without this a Windows
      # contributor can reintroduce CRLF and no one notices until lint explodes.
      - name: Format check
        run: npm run format:check

      # Unit + contract + SDR integration suites. No network, no Supabase:
      # handlers take injected deps and tests/fixtures/mock-sdr.ts stands in
      # for the distribution service.
      - name: Tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next build inlines NEXT_PUBLIC_* at build time, so CI supplies dummies.
      # They must NOT contain "placeholder" / "YOUR_" — createSupabaseClient()
      # in src/integrations/supabase/client.ts throws on those patterns by
      # design. These values are not credentials and reach nothing real.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build-only.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
          SUPABASE_URL: https://ci-build-only.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
          APP_URL: https://ci-build-only.invalid

  security:
    name: Secret scan · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Fails on committed tokens/keys/passwords (patterns in the script).
      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      # Production dependencies only; high/critical advisories fail the build.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migration replay · RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Replays supabase/baseline/manifest.txt + every newer migration on an
      # empty in-process Postgres (PGlite), re-applies the post-baseline ones to
      # prove they are idempotent, and fails if any public table lacks RLS.
      # (The tenant-isolation suite in tests/db runs inside `npm test`.)
      - name: Replay migrations
        run: npm run db:verify

  sdr:
    name: SDR service · pytest · ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Social-Distribtion-Engine-RavalAI-SDE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Social-Distribtion-Engine-RavalAI-SDE/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A throwaway key per run: no key material lives in the repository.
      - name: Generate test encryption key
        run: echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Ruff
        run: ruff check app tests

      # SQLite + an in-process queue stub (tests/conftest.py): no Postgres or
      # Redis service needed.
      - name: Pytest
        run: pytest -q
