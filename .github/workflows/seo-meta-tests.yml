name: SEO / meta messaging tests

# Runs the pitch-deck-aligned SEO, OpenGraph, Twitter Card and JSON-LD
# suites on every pull request and on pushes to master. Configure this job
# as a required status check in the repository's branch protection rules
# so merges are blocked when any of these tests fail.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: seo-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-meta:
    name: SEO + OG + JSON-LD + route snapshots (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build the app
        run: npm run build:dev

      - name: Start dev server
        run: |
          nohup npm run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
        env:
          CI: "true"

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/ -o /dev/null; then
              echo "dev server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "dev server never became ready" >&2
          tail -n 200 /tmp/dev-server.log >&2 || true
          exit 1

      - name: Run SEO / meta / JSON-LD / route-snapshot tests
        run: npm run test:seo
        env:
          CI: "true"

      - name: Validate sitemap.xml (canonical + indexable)
        run: npm run test:sitemap
        env:
          CI: "true"
          SITEMAP_BASE_URL: "http://localhost:8080"

      - name: Validate robots.txt (sitemap directive + disallow coverage)
        run: npm run test:robots
        env:
          CI: "true"
          SITEMAP_BASE_URL: "http://localhost:8080"

      - name: Validate hreflang + self-canonical across sitemap
        run: npm run test:hreflang
        env:
          CI: "true"
          SITEMAP_BASE_URL: "http://localhost:8080"

      - name: Stop dev server
        if: always()
        run: |
          if [ -f /tmp/dev-server.pid ]; then
            kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: /tmp/dev-server.log
          if-no-files-found: ignore
          retention-days: 7
