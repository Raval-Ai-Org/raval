name: SEO / meta messaging tests

# Runs the pitch-deck-aligned SEO, OpenGraph, Twitter Card and JSON-LD
# suites on every pull request and on pushes to master. Configure this job
# as a required status check in the repository's branch protection rules
# so merges are blocked when any of these tests fail.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

# The browser Supabase client refuses placeholder values, so the build and the
# dev server get CI-only dummies (they reach nothing real). APP_URL drives the
# canonical URLs, robots.txt and sitemap the suites assert on.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-build-only.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
  SUPABASE_URL: https://ci-build-only.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
  APP_URL: https://mellox.ai
  NEXT_PUBLIC_APP_URL: https://mellox.ai
  NEXT_PUBLIC_SITE_URL: https://mellox.ai

concurrency:
  group: seo-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-meta:
    name: SEO + OG + JSON-LD + route snapshots (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build the app
        run: npm run build

      - name: Start production server
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          nohup node .next/standalone/server.js > /tmp/seo-server.log 2>&1 &
          echo $! > /tmp/seo-server.pid
        env:
          CI: "true"
          NODE_ENV: production
          PORT: "8080"
          HOSTNAME: "127.0.0.1"
          # CI intentionally has no production-only AI or cron credentials.
          ENV_VALIDATION: warn

      - name: Wait for production server
        run: |
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:8080/ -o /dev/null; then
              echo "production server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "production server never became ready" >&2
          tail -n 200 /tmp/seo-server.log >&2 || true
          exit 1

      - name: Run SEO / meta / JSON-LD / route-snapshot tests
        run: npm run test:seo
        env:
          CI: "true"

      - name: Validate sitemap.xml (canonical + indexable)
        run: npm run test:sitemap
        env:
          CI: "true"
          SITEMAP_BASE_URL: "http://localhost:8080"

      - name: Validate robots.txt (sitemap directive + disallow coverage)
        run: npm run test:robots
        env:
          CI: "true"
          SITEMAP_BASE_URL: "http://localhost:8080"

      - name: Validate hreflang + self-canonical across sitemap
        run: npm run test:hreflang
        env:
          CI: "true"
          SITEMAP_BASE_URL: "http://localhost:8080"

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/seo-server.pid ]; then
            kill "$(cat /tmp/seo-server.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seo-server-log
          path: /tmp/seo-server.log
          if-no-files-found: ignore
          retention-days: 7
