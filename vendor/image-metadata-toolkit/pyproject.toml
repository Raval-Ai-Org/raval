[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-metadata-toolkit"
version = "1.0.0"
description = "Audit, clean, attribute, and verify WebP, JPEG, and PNG metadata."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kyle Corpin" }]
keywords = ["exif", "xmp", "privacy", "metadata", "webp", "jpeg", "png"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/GitBreak/image-metadata-toolkit"
Issues = "https://github.com/GitBreak/image-metadata-toolkit/issues"

[project.scripts]
image-metadata-toolkit = "image_metadata_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["image_metadata_toolkit*"]
