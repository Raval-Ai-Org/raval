version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: raval-sde-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sde_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-raval_sde}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sde}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raval-sde

  # Redis Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: raval-sde-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raval-sde

  # FastAPI Web Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: raval-sde-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PYTHONUNBUFFERED: "1"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sde}:${POSTGRES_PASSWORD:-sde_dev_password}@postgres:5432/${POSTGRES_DB:-raval_sde}
      REDIS_URL: redis://redis:6379/0
      SDE_API_TOKEN: ${SDE_API_TOKEN:-dev-token-change-in-production}
      SDE_SIGNING_SECRET: ${SDE_SIGNING_SECRET:-dev-secret-change-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - raval-sde
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: raval-sde-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      PYTHONUNBUFFERED: "1"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Both URL variants are required: the Celery worker uses the SYNC
      # session maker (get_sync_session_maker → DATABASE_URL_SYNC), which
      # config.py otherwise derives from POSTGRES_HOST (defaults to localhost,
      # unreachable inside the container). Point it at the postgres service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sde}:${POSTGRES_PASSWORD:-sde_dev_password}@postgres:5432/${POSTGRES_DB:-raval_sde}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-sde}:${POSTGRES_PASSWORD:-sde_dev_password}@postgres:5432/${POSTGRES_DB:-raval_sde}
      REDIS_URL: redis://redis:6379/0
      SDE_API_TOKEN: ${SDE_API_TOKEN:-dev-token-change-in-production}
      SDE_SIGNING_SECRET: ${SDE_SIGNING_SECRET:-dev-secret-change-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - raval-sde

  # Celery Beat Scheduler
  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: raval-sde-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      PYTHONUNBUFFERED: "1"
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Both URL variants are required: the Celery worker uses the SYNC
      # session maker (get_sync_session_maker → DATABASE_URL_SYNC), which
      # config.py otherwise derives from POSTGRES_HOST (defaults to localhost,
      # unreachable inside the container). Point it at the postgres service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-sde}:${POSTGRES_PASSWORD:-sde_dev_password}@postgres:5432/${POSTGRES_DB:-raval_sde}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-sde}:${POSTGRES_PASSWORD:-sde_dev_password}@postgres:5432/${POSTGRES_DB:-raval_sde}
      REDIS_URL: redis://redis:6379/0
      SDE_API_TOKEN: ${SDE_API_TOKEN:-dev-token-change-in-production}
      SDE_SIGNING_SECRET: ${SDE_SIGNING_SECRET:-dev-secret-change-in-production}
      FERNET_KEY: ${FERNET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - raval-sde

  # Celery Flower (Monitoring)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: raval-sde-flower
    command: celery -A app.celery_app flower --port=5555 --broker=redis://redis:6379/0
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - raval-sde
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  raval-sde:
    driver: bridge
